<!doctype html>
<html>
<head><meta charset="utf-8"><title>Login</title></head>
<body>
  <h2>Login</h2>
  <form id="loginForm">
    <label>Username: <input id="username" /></label><br/>
    <label>Password: <input id="password" type="password" /></label><br/>
    <button id="loginBtn" type="button">Login</button>
  </form>
  <script>
    document.getElementById('loginBtn').onclick = function(){
      var u = document.getElementById('username').value;
      var p = document.getElementById('password').value;
      // simple simulation: username 'user1' password 'pass1'
      if(u === 'user1' && p === 'pass1'){
        // simulate OTP page step by multi-page auth: redirect to dashboard with a token param
        window.location = 'dashboard.html?user=' + encodeURIComponent(u);
      } else {
        alert('Invalid credentials');
      }
    };
  </script>
</body>
</html>
